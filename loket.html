<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Operator V2 (Firebase)</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f2f7; color: #1c1c1e; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 16px; }
    
    .setup-screen { display: flex; flex-direction: column; gap: 16px; text-align: center; padding: 10px 0; }
    .setup-title { font-size: 20px; font-weight: 800; color: #1c1c1e; }
    .setup-sub { font-size: 14px; color: #8e8e93; }
    .grid-loket-btn { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .btn-select-loket { background: #007aff; color: white; border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; }
    
    .loket-header-bar { display: flex; justify-content: space-between; align-items: center; background: #e5f1ff; padding: 12px 16px; border-radius: 14px; border: 1px solid #b3d7ff; }
    .loket-active-title { font-size: 18px; font-weight: 800; color: #007aff; }
    .btn-change-loket { background: transparent; border: 1px solid #007aff; color: #007aff; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    
    .display-box { background: #f2f2f7; border-radius: 16px; padding: 16px; text-align: center; }
    .num-serving { font-size: 56px; font-weight: 800; color: #007aff; line-height: 1; margin-top: 6px; }
    .skipped-box { background: #fff9e6; border: 1px solid #ffe082; border-radius: 14px; padding: 12px; }
    .skipped-title { font-size: 12px; font-weight: 700; color: #b78103; margin-bottom: 8px; text-transform: uppercase; }
    .skipped-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skipped-btn { background: #ff9500; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 800; font-size: 15px; cursor: pointer; }
    .skipped-empty { font-size: 12px; color: #a1887f; font-style: italic; }
    
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-next { background: #34c759; color: white; }
    .btn-skip { background: #ff9500; color: white; }
    .btn-recall { background: #007aff; color: white; }
    
    /* KUNCI TOMBOL ANTI-SPAM */
    .btn:disabled, .btn-manual:disabled, .btn-reset:disabled, .skipped-btn:disabled {
      background: #8e8e93 !important;
      color: #ffffff !important;
      opacity: 0.7 !important;
      cursor: not-allowed !important;
    }

    .manual-box { padding-top: 12px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; align-items: center; }
    .manual-box input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; }
    .btn-manual { padding: 12px 16px; border-radius: 10px; border: none; background: #5856d6; color: white; font-weight: 700; cursor: pointer; }
    
    .reset-box { padding-top: 8px; border-top: 1px solid #e5e5ea; margin-top: 4px; }
    .btn-reset { background: #ff3b30; color: white; font-size: 14px; padding: 12px; width: 100%; border: none; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="screenSetup" class="setup-screen">
      <div class="setup-title">Pilih Loket Operator</div>
      <div class="setup-sub">Sistem Antrean Realtime V2</div>
      <div class="grid-loket-btn" id="gridLoketContainer"></div>
    </div>

    <div id="screenOperator" style="display: none; flex-direction: column; gap: 16px;">
      <div class="loket-header-bar">
        <div class="loket-active-title" id="textActiveLoket">LOKET 1</div>
        <button class="btn-change-loket" onclick="gantiLoket()">Ganti Loket</button>
      </div>

      <div class="display-box">
        <div style="font-size: 11px; color: #8e8e93; font-weight: 700; letter-spacing: 1px;">SEDANG DILAYANI LOKET INI</div>
        <div class="num-serving" id="numServing">-</div>
      </div>

      <div class="skipped-box">
        <div class="skipped-title">⚠️ KLIK UNTUK PANGGIL NOMOR DILEWATI:</div>
        <div class="skipped-list" id="skippedContainer">
          <span class="skipped-empty">Tidak ada nomor dilewati</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-next" id="btnNext" onclick="panggilNext()">BERIKUTNYA</button>
        <button class="btn btn-skip" id="btnSkip" onclick="panggilSkip()">LEWATI</button>
        <button class="btn btn-recall" id="btnRecall" onclick="panggilRecall()">PANGGIL ULANG</button>
      </div>

      <div class="manual-box">
        <input type="number" id="manualNum" placeholder="No. Spesifik">
        <button class="btn-manual" id="btnManual" onclick="panggilManual()">PANGGIL</button>
      </div>

      <div class="reset-box">
        <button class="btn btn-reset" id="btnReset" onclick="konfirmasiReset()">🔄 RESET SEMUA ANTREAN KE 0</button>
      </div>
    </div>

  </div>

  <script>
    // 1. CONFIG FIREBASE V2
    const firebaseConfig = {
  apiKey: "AIzaSyC9GO9C09OchmPPh8nvjKDaKH_iyx7Navo",
  authDomain: "antrian-v2.firebaseapp.com",
  databaseURL: "https://antrian-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "antrian-v2",
  storageBucket: "antrian-v2.firebasestorage.app",
  messagingSenderId: "772961061085",
  appId: "1:772961061085:web:e0875c5f7b59c44af7b334"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const refAntrean = db.ref('antrean_v2');

    let selectedLoket = localStorage.getItem('operatorLoket') || null;
    let globalData = {};
    let isProcessing = false;

    window.onload = function() {
      if (selectedLoket) showOperatorPanel();
      
      // Sync Realtime
      refAntrean.on('value', (snapshot) => {
        globalData = snapshot.val() || {};
        renderUI();
      });
    };

    function renderUI() {
      const totalLoket = globalData.totalLoket || 5;
      renderSetupButtons(totalLoket);

      if (selectedLoket) {
        const loketData = globalData.loketData || {};
        document.getElementById('numServing').innerText = loketData[selectedLoket] || "-";

        const skipped = globalData.skipped || [];
        const container = document.getElementById('skippedContainer');
        if (skipped.length > 0) {
          container.innerHTML = skipped.map(num => 
            `<button class="skipped-btn" onclick="panggilTerlewat(${num})">No. ${num}</button>`
          ).join('');
        } else {
          container.innerHTML = '<span class="skipped-empty">Tidak ada nomor dilewati</span>';
        }
      }
    }

    function renderSetupButtons(total) {
      const container = document.getElementById('gridLoketContainer');
      if (container.children.length === total) return;
      container.innerHTML = '';
      for (let i = 1; i <= total; i++) {
        const isLastOdd = (i === total && total % 2 !== 0);
        const style = isLastOdd ? 'style="grid-column: span 2;"' : '';
        container.innerHTML += `<button class="btn-select-loket" ${style} onclick="pilihLoket(${i})">LOKET ${i}</button>`;
      }
    }

    function pilihLoket(loketNum) {
      selectedLoket = loketNum;
      localStorage.setItem('operatorLoket', loketNum);
      showOperatorPanel();
    }

    function gantiLoket() {
      if (confirm("Ingin berpindah ke loket lain?")) {
        localStorage.removeItem('operatorLoket');
        selectedLoket = null;
        document.getElementById('screenOperator').style.display = 'none';
        document.getElementById('screenSetup').style.display = 'flex';
      }
    }

    function showOperatorPanel() {
      document.getElementById('screenSetup').style.display = 'none';
      document.getElementById('screenOperator').style.display = 'flex';
      document.getElementById('textActiveLoket').innerText = `LOKET ${selectedLoket}`;
      renderUI();
    }

    // FUNGSI LOCK BUTTON ANTI-SPAM (Kunci 1,2 detik per panggil)
    function lockButtons() {
      isProcessing = true;
      document.getElementById('btnNext').disabled = true;
      document.getElementById('btnSkip').disabled = true;
      document.getElementById('btnRecall').disabled = true;
      document.getElementById('btnNext').innerText = "⏳ MEMPROSES...";

      setTimeout(() => {
        isProcessing = false;
        document.getElementById('btnNext').disabled = false;
        document.getElementById('btnSkip').disabled = false;
        document.getElementById('btnRecall').disabled = false;
        document.getElementById('btnNext').innerText = "BERIKUTNYA";
      }, 1200); 
    }

    function panggilNext() {
      if (isProcessing) return;
      lockButtons();

      const nextNum = (globalData.globalCounter || 0) + 1;
      const loketData = globalData.loketData || {};
      loketData[selectedLoket] = nextNum;

      refAntrean.update({
        globalCounter: nextNum,
        loketData: loketData,
        lastCall: { nomor: nextNum, loket: selectedLoket, timestamp: Date.now() }
      });
    }

    function panggilSkip() {
      if (isProcessing) return;
      lockButtons();

      const currentNum = (globalData.loketData || {})[selectedLoket];
      let skipped = globalData.skipped || [];
      if (currentNum && !skipped.includes(currentNum)) {
        skipped.push(currentNum);
        skipped.sort((a, b) => a - b);
      }

      const nextNum = (globalData.globalCounter || 0) + 1;
      const loketData = globalData.loketData || {};
      loketData[selectedLoket] = nextNum;

      refAntrean.update({
        globalCounter: nextNum,
        skipped: skipped,
        loketData: loketData,
        lastCall: { nomor: nextNum, loket: selectedLoket, timestamp: Date.now() }
      });
    }

    function panggilRecall() {
      if (isProcessing) return;
      const currentNum = (globalData.loketData || {})[selectedLoket];
      if (currentNum) {
        lockButtons();
        refAntrean.child('lastCall').set({
          nomor: currentNum,
          loket: selectedLoket,
          timestamp: Date.now()
        });
      } else {
        alert("Belum ada nomor yang aktif di loket ini.");
      }
    }

    function panggilTerlewat(nomor) {
      if (isProcessing) return;
      if (confirm(`Panggil Nomor Terlewat (${nomor}) ke Loket ${selectedLoket}?`)) {
        lockButtons();
        let skipped = (globalData.skipped || []).filter(n => n !== nomor);
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = nomor;

        refAntrean.update({
          skipped: skipped,
          loketData: loketData,
          lastCall: { nomor: nomor, loket: selectedLoket, timestamp: Date.now() }
        });
      }
    }

    function panggilManual() {
      if (isProcessing) return;
      const num = parseInt(document.getElementById('manualNum').value);
      if (num && num > 0) {
        lockButtons();
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = num;

        refAntrean.update({
          loketData: loketData,
          lastCall: { nomor: num, loket: selectedLoket, timestamp: Date.now() }
        });
        document.getElementById('manualNum').value = '';
      }
    }

    function konfirmasiReset() {
      if (confirm("Reset SELURUH ANTREAN ke 0?")) {
        refAntrean.set({
          globalCounter: 0,
          totalLoket: globalData.totalLoket || 5,
          skipped: [],
          loketData: {},
          lastCall: null
        });
      }
    }
  </script>
</body>
</html>
