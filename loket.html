<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Operator V2.3</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f2f7; color: #1c1c1e; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px; }
    
    .setup-screen { display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .setup-title { font-size: 20px; font-weight: 800; }
    .grid-loket-btn { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .btn-select-loket { background: #007aff; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
    
    .loket-header-bar { display: flex; justify-content: space-between; align-items: center; background: #e5f1ff; padding: 10px 14px; border-radius: 12px; border: 1px solid #b3d7ff; }
    .loket-active-title { font-size: 16px; font-weight: 800; color: #007aff; }
    .btn-change-loket { background: white; border: 1px solid #007aff; color: #007aff; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    
    .display-box { background: #f2f2f7; border-radius: 14px; padding: 14px; text-align: center; }
    .num-serving { font-size: 52px; font-weight: 800; color: #007aff; line-height: 1; margin-top: 4px; }
    
    .skipped-box { background: #fff9e6; border: 1px solid #ffe082; border-radius: 12px; padding: 10px; }
    .skipped-title { font-size: 11px; font-weight: 700; color: #b78103; margin-bottom: 6px; text-transform: uppercase; }
    .skipped-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .skipped-btn { background: #ff9500; color: white; border: none; padding: 6px 12px; border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; }
    .skipped-empty { font-size: 12px; color: #a1887f; font-style: italic; }
    
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-next { background: #34c759; color: white; }
    .btn-skip { background: #ff9500; color: white; }
    .btn-recall { background: #007aff; color: white; }
    
    .btn:disabled, .btn-manual:disabled, .btn-reset:disabled, .skipped-btn:disabled {
      background: #8e8e93 !important; color: #ffffff !important; opacity: 0.7 !important; cursor: not-allowed !important;
    }

    .box-input-group { border-top: 1px solid #e5e5ea; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .label-input { font-size: 11px; font-weight: 700; color: #8e8e93; text-transform: uppercase; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    .btn-manual { padding: 10px 14px; border-radius: 8px; border: none; background: #5856d6; color: white; font-weight: 700; cursor: pointer; }
    .btn-set-start { padding: 10px 14px; border-radius: 8px; border: none; background: #ff9500; color: white; font-weight: 700; cursor: pointer; }

    .btn-reset { background: #ff3b30; color: white; font-size: 13px; padding: 10px; width: 100%; border: none; border-radius: 8px; font-weight: bold; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LAYAR PILIH LOKET OPERATOR -->
    <div id="screenSetup" class="setup-screen">
      <div class="setup-title">Pilih Loket Operator</div>
      <div class="grid-loket-btn" id="gridLoketContainer"></div>
    </div>

    <!-- LAYAR UTAMA OPERATOR -->
    <div id="screenOperator" style="display: none; flex-direction: column; gap: 12px;">
      <div class="loket-header-bar">
        <div class="loket-active-title" id="textActiveLoket">LOKET 1</div>
        <button class="btn-change-loket" onclick="gantiLoket()">🔄 Ganti / Pilih Loket</button>
      </div>

      <div class="display-box">
        <div style="font-size: 11px; color: #8e8e93; font-weight: 700;">SEDANG DILAYANI LOKET INI</div>
        <div class="num-serving" id="numServing">-</div>
      </div>

      <div class="skipped-box">
        <div class="skipped-title">⚠️ NOMOR DILEWATI (TAP UNTUK PANGGIL):</div>
        <div class="skipped-list" id="skippedContainer">
          <span class="skipped-empty">Tidak ada nomor dilewati</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-next" id="btnNext" onclick="panggilNext()">BERIKUTNYA</button>
        <button class="btn btn-skip" id="btnSkip" onclick="panggilSkip()">LEWATI</button>
        <button class="btn btn-recall" id="btnRecall" onclick="panggilRecall()">PANGGIL ULANG</button>
      </div>

      <!-- FITUR SET START NOMOR -->
      <div class="box-input-group">
        <div class="label-input">Mulai Panggil Antrean Dari Nomor Berapa:</div>
        <div class="input-row">
          <input type="number" id="startNumInput" placeholder="Contoh: 50">
          <button class="btn-set-start" id="btnSetStart" onclick="setMulaiNomor()">SET START</button>
        </div>
      </div>

      <!-- PANGGIL NOMOR SPESIFIK -->
      <div class="box-input-group">
        <div class="label-input">Panggil Nomor Khusus/Spesifik:</div>
        <div class="input-row">
          <input type="number" id="manualNum" placeholder="No. Khusus">
          <button class="btn-manual" id="btnManual" onclick="panggilManual()">PANGGIL</button>
        </div>
      </div>

      <button class="btn-reset" onclick="konfirmasiReset()">🔄 RESET SEMUA ANTREAN KE 0</button>
    </div>

  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyC9GO9C09OchmPPh8nvjKDaKH_iyx7Navo",
  authDomain: "antrian-v2.firebaseapp.com",
  databaseURL: "https://antrian-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "antrian-v2",
  storageBucket: "antrian-v2.firebasestorage.app",
  messagingSenderId: "772961061085",
  appId: "1:772961061085:web:e0875c5f7b59c44af7b334"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const refAntrean = db.ref('antrean_v2');

    let selectedLoket = localStorage.getItem('operatorLoket') || null;
    let globalData = {};
    let isProcessing = false;

    window.onload = function() {
      if (selectedLoket) showOperatorPanel();
      refAntrean.on('value', (snapshot) => {
        globalData = snapshot.val() || {};
        renderUI();
      });
    };

    function renderUI() {
      const totalLoket = globalData.totalLoket || 5;
      renderSetupButtons(totalLoket);

      if (selectedLoket) {
        const loketData = globalData.loketData || {};
        document.getElementById('numServing').innerText = loketData[selectedLoket] || "-";

        const skipped = globalData.skipped || [];
        const container = document.getElementById('skippedContainer');
        container.innerHTML = skipped.length > 0 ? skipped.map(num => `<button class="skipped-btn" onclick="panggilTerlewat(${num})">No. ${num}</button>`).join('') : '<span class="skipped-empty">Tidak ada nomor dilewati</span>';
      }
    }

    function renderSetupButtons(total) {
      const container = document.getElementById('gridLoketContainer');
      container.innerHTML = '';
      for (let i = 1; i <= total; i++) {
        container.innerHTML += `<button class="btn-select-loket" onclick="pilihLoket(${i})">LOKET ${i}</button>`;
      }
    }

    function pilihLoket(loketNum) {
      selectedLoket = loketNum;
      localStorage.setItem('operatorLoket', loketNum);
      showOperatorPanel();
    }

    function gantiLoket() {
      localStorage.removeItem('operatorLoket');
      selectedLoket = null;
      document.getElementById('screenOperator').style.display = 'none';
      document.getElementById('screenSetup').style.display = 'flex';
    }

    function showOperatorPanel() {
      document.getElementById('screenSetup').style.display = 'none';
      document.getElementById('screenOperator').style.display = 'flex';
      document.getElementById('textActiveLoket').innerText = `LOKET ${selectedLoket}`;
      renderUI();
    }

    function lockButtons() {
      isProcessing = true;
      document.getElementById('btnNext').disabled = true;
      document.getElementById('btnSkip').disabled = true;
      document.getElementById('btnRecall').disabled = true;
      document.getElementById('btnNext').innerText = "⏳ MEMPROSES...";

      setTimeout(() => {
        isProcessing = false;
        document.getElementById('btnNext').disabled = false;
        document.getElementById('btnSkip').disabled = false;
        document.getElementById('btnRecall').disabled = false;
        document.getElementById('btnNext').innerText = "BERIKUTNYA";
      }, 1200); 
    }

    function panggilNext() {
      if (isProcessing) return;
      lockButtons();

      const nextNum = (globalData.globalCounter || 0) + 1;
      const loketData = globalData.loketData || {};
      loketData[selectedLoket] = nextNum;

      refAntrean.update({
        globalCounter: nextNum,
        loketData: loketData,
        lastCall: { nomor: nextNum, loket: selectedLoket, timestamp: Date.now() }
      });
    }

    // UPDATE LOGIKA TOMBOL LEWATI (V2.3)
    function panggilSkip() {
      if (isProcessing) return;

      const currentNum = (globalData.loketData || {})[selectedLoket];
      if (!currentNum || currentNum <= 0) {
        alert("Belum ada nomor yang aktif di loket ini.");
        return;
      }

      lockButtons();

      let skipped = globalData.skipped || [];
      if (!skipped.includes(currentNum)) {
        skipped.push(currentNum);
        skipped.sort((a, b) => a - b);
      }

      const globalCounter = globalData.globalCounter || 0;

      // Jika nomor yang sedang di-skip adalah nomor terlewat/panggilan lama (kurang dari globalCounter)
      if (currentNum < globalCounter) {
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = "-"; // Reset status loket jadi kosong dulu

        refAntrean.update({
          skipped: skipped,
          loketData: loketData
        });
      } else {
        // Jika nomor yang di-skip adalah urutan paling baru, lanjut panggil urutan berikutnya
        const nextNum = globalCounter + 1;
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = nextNum;

        refAntrean.update({
          globalCounter: nextNum,
          skipped: skipped,
          loketData: loketData,
          lastCall: { nomor: nextNum, loket: selectedLoket, timestamp: Date.now() }
        });
      }
    }

    function panggilRecall() {
      if (isProcessing) return;
      const currentNum = (globalData.loketData || {})[selectedLoket];
      if (currentNum && currentNum !== "-") {
        lockButtons();
        refAntrean.child('lastCall').set({
          nomor: currentNum,
          loket: selectedLoket,
          timestamp: Date.now()
        });
      } else {
        alert("Belum ada nomor yang aktif di loket ini.");
      }
    }

    function panggilTerlewat(nomor) {
      if (isProcessing) return;
      if (confirm(`Panggil Nomor Terlewat (${nomor}) ke Loket ${selectedLoket}?`)) {
        lockButtons();
        let skipped = (globalData.skipped || []).filter(n => n !== nomor);
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = nomor;

        refAntrean.update({
          skipped: skipped,
          loketData: loketData,
          lastCall: { nomor: nomor, loket: selectedLoket, timestamp: Date.now() }
        });
      }
    }

    function setMulaiNomor() {
      if (isProcessing) return;
      const startNum = parseInt(document.getElementById('startNumInput').value);
      if (startNum && startNum > 0) {
        if (confirm(`Atur antrean agar panggilan berikutnya dimulai dari nomor ${startNum}?`)) {
          lockButtons();
          refAntrean.update({
            globalCounter: startNum - 1
          });
          document.getElementById('startNumInput').value = '';
          alert(`Berhasil! Tekan BERIKUTNYA untuk memanggil nomor ${startNum}.`);
        }
      }
    }

    function panggilManual() {
      if (isProcessing) return;
      const num = parseInt(document.getElementById('manualNum').value);
      if (num && num > 0) {
        lockButtons();
        const loketData = globalData.loketData || {};
        loketData[selectedLoket] = num;

        refAntrean.update({
          loketData: loketData,
          lastCall: { nomor: num, loket: selectedLoket, timestamp: Date.now() }
        });
        document.getElementById('manualNum').value = '';
      }
    }

    function konfirmasiReset() {
      if (confirm("Reset SELURUH ANTREAN ke 0?")) {
        refAntrean.set({
          globalCounter: 0,
          totalLoket: globalData.totalLoket || 5,
          skipped: [],
          loketData: {},
          lastCall: null
        });
      }
    }
  </script>
</body>
</html>
