<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Display Antrean Sentral V2.4</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; overflow: hidden; }

    /* OVERLAY AKTIVASI AUDIO */
    #audioOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 16px;
    }
    #btnEnableAudio {
      background: #34c759; color: white; border: none; padding: 20px 40px;
      font-size: 24px; font-weight: 800; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 30px rgba(52, 199, 89, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    header { text-align: center; margin-top: 10px; }
    h1 { font-size: 32px; font-weight: 800; color: #ffffff; letter-spacing: 2px; }
    
    .main-display { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c1c1e; border: 4px solid #3a3a3c; border-radius: 32px; width: 90vw; max-width: 800px; padding: 40px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .label-call { font-size: 24px; font-weight: 700; color: #8e8e93; text-transform: uppercase; letter-spacing: 3px; }
    .number-call { font-size: 140px; font-weight: 900; color: #30d158; line-height: 1; margin: 10px 0; text-shadow: 0 0 20px rgba(48, 209, 88, 0.4); }
    .loket-call { font-size: 40px; font-weight: 800; color: #0a84ff; text-transform: uppercase; }

    .grid-loket { display: flex; justify-content: center; gap: 16px; width: 100%; max-width: 1200px; margin-bottom: 20px; flex-wrap: wrap; }
    .card-loket { background: #1c1c1e; border-radius: 20px; padding: 20px; flex: 1; min-width: 160px; text-align: center; border: 1px solid #2c2c2e; }
    .card-title { font-size: 18px; font-weight: 700; color: #8e8e93; }
    .card-num { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- MODAL UNTUK MEMBUKA IZIN AUDIO BROWSER -->
  <div id="audioOverlay">
    <h2 style="color: white; text-align: center;">Sistem Antrean Siap</h2>
    <p style="color: #8e8e93; text-align: center; max-width: 400px;">Klik tombol di bawah ini agar browser mengizinkan pemanggilan suara secara otomatis.</p>
    <button id="btnEnableAudio" onclick="enableAudio()">🔊 AKTIFKAN SUARA DISPLAY</button>
  </div>

  <header>
    <h1>PANGGILAN ANTREAN</h1>
  </header>

  <div class="main-display">
    <div class="label-call">NOMOR ANTREAN</div>
    <div class="number-call" id="mainNumber">-</div>
    <div class="loket-call" id="mainLoket">MENUJU LOKET -</div>
  </div>

  <div class="grid-loket" id="gridLoket"></div>

  <script>
    const firebaseConfig = {

  apiKey: "AIzaSyC9GO9C09OchmPPh8nvjKDaKH_iyx7Navo",
  authDomain: "antrian-v2.firebaseapp.com",
  databaseURL: "https://antrian-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "antrian-v2",
  storageBucket: "antrian-v2.firebasestorage.app",
  messagingSenderId: "772961061085",
  appId: "1:772961061085:web:e0875c5f7b59c44af7b334"

};


    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const refAntrean = db.ref('antrean_v2');

    let lastProcessedTimestamp = 0;
    let audioQueue = [];
    let isSpeaking = false;
    let audioEnabled = false;

    // FUNGSI MEMBUKA BLOKIR AUDIO BROWSER
    function enableAudio() {
      audioEnabled = true;
      document.getElementById('audioOverlay').style.display = 'none';

      // Panggil suara hening 1x untuk memancing izin audio dari browser
      if ('speechSynthesis' in window) {
        const dummyUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(dummyUtterance);
      }
    }

    window.onload = function() {
      refAntrean.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        renderDisplay(data);
        
        if (data.lastCall && data.lastCall.timestamp > lastProcessedTimestamp) {
          lastProcessedTimestamp = data.lastCall.timestamp;
          
          // Masukkan ke antrean antrean audio agar tidak bentrok jika diklik berdekatan
          audioQueue.push({
            nomor: data.lastCall.nomor,
            loket: data.lastCall.loket
          });
          
          processAudioQueue();
        }
      });
    };

    function renderDisplay(data) {
      const totalLoket = data.totalLoket || 5;
      const loketData = data.loketData || {};

      if (data.lastCall) {
        document.getElementById('mainNumber').innerText = data.lastCall.nomor || "-";
        document.getElementById('mainLoket').innerText = `MENUJU LOKET ${data.lastCall.loket || "-"}`;
      }

      const gridContainer = document.getElementById('gridLoket');
      gridContainer.innerHTML = '';
      for (let i = 1; i <= totalLoket; i++) {
        const num = loketData[i] || "-";
        gridContainer.innerHTML += `
          <div class="card-loket">
            <div class="card-title">LOKET ${i}</div>
            <div class="card-num">${num}</div>
          </div>
        `;
      }
    }

    // LOGIKA ANTREAN SUARA (MENCEGAH BENTROK KLIK BERSAMAAN)
    function processAudioQueue() {
      if (isSpeaking || audioQueue.length === 0 || !audioEnabled) return;

      isSpeaking = true;
      const currentCall = audioQueue.shift();

      const teksPanggilan = `Nomor antrean, ${currentCall.nomor}, silahkan menuju, loket ${currentCall.loket}`;

      if ('speechSynthesis' in window) {
        // Hentikan suara sebelumnya jika ada yang tersisa
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(teksPanggilan);
        utterance.lang = 'id-ID';
        utterance.rate = 0.85; // Kecepatan bicara
        utterance.pitch = 1;

        utterance.onend = function() {
          isSpeaking = false;
          // Cek apakah ada antrean panggilan selanjutnya yang masuk saat antrean ini sedang berbunyi
          setTimeout(processAudioQueue, 500);
        };

        utterance.onerror = function() {
          isSpeaking = false;
          setTimeout(processAudioQueue, 500);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        console.warn("Browser tidak mendukung Web Speech API");
        isSpeaking = false;
      }
    }
  </script>
</body>
</html>
