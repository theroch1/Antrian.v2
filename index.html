<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Antrean V2.6</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #1c1c1e; color: #ffffff; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; gap: 20px; }
    
    .header-instansi { background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 20px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; position: relative; z-index: 100; }
    .brand-box h1 { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
    .brand-box p { font-size: 14px; color: #8e8e93; font-weight: 500; }
    
    .control-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 101; }
    
    .btn-act { border: none; padding: 12px 18px; font-size: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; user-select: none; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.1s ease, opacity 0.2s ease; }
    .btn-act:active { transform: scale(0.95); }
    
    .btn-loket-add { background: #0a84ff; color: #ffffff; }
    .btn-loket-sub { background: #ff453a; color: #ffffff; }
    .btn-audio { background: #ff9f0a; color: #1c1c1e; }
    .btn-audio.active { background: #30d158; color: #ffffff; }

    .main-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 900px) { .main-grid { grid-template-columns: 2fr 1fr; } }
    
    .hero-card { background: #2c2c2e; border-radius: 24px; padding: 32px 20px; border: 1px solid #3a3a3c; text-align: center; }
    .label-title { font-size: 18px; color: #8e8e93; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .queue-number { font-size: 110px; font-weight: 900; color: #30d158; line-height: 1; margin: 10px 0; }
    .loket-title { font-size: 32px; font-weight: 700; color: #0a84ff; }
    
    .box-card { background: #2c2c2e; border-radius: 20px; padding: 20px; border: 1px solid #3a3a3c; border-top: 4px solid #ff9f0a; }
    .box-header { font-size: 15px; font-weight: 800; color: #ff9f0a; text-transform: uppercase; margin-bottom: 12px; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-item { background: #ff9f0a; color: #1c1c1e; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 16px; }
    .empty-text { font-size: 14px; color: #8e8e93; font-style: italic; }

    .loket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .loket-card { background: #2c2c2e; border-radius: 18px; padding: 16px; border: 1px solid #3a3a3c; text-align: center; border-top: 4px solid #0a84ff; }
    .loket-card-name { font-size: 13px; font-weight: 800; color: #8e8e93; text-transform: uppercase; }
    .loket-card-num { font-size: 32px; font-weight: 900; color: #ffffff; margin-top: 4px; }

    .status-footer { text-align: center; font-size: 13px; color: #8e8e93; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header-instansi">
    <div class="brand-box">
      <h1>SISTEM ANTREAN LOKET</h1>
      <p>Display Realtime Firebase</p>
    </div>

    <div class="control-group">
      <button id="btnAddLoket" class="btn-act btn-loket-add">➕ Tambah Loket</button>
      <button id="btnSubLoket" class="btn-act btn-loket-sub">➖ Kurang Loket</button>
      <button id="btnAktifkan" class="btn-act btn-audio">🔊 AKTIFKAN AUDIO & BEL</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="hero-card">
      <div class="label-title">Panggilan Saat Ini</div>
      <div class="queue-number" id="numDisplay">0</div>
      <div class="loket-title" id="loketDisplay">Menunggu Panggilan...</div>
    </div>

    <div class="box-card">
      <div class="box-header">⚠️ Nomor Dilewati:</div>
      <div class="tag-container" id="skippedContainer">
        <span class="empty-text">Tidak ada nomor terlewat</span>
      </div>
    </div>
  </div>

  <div class="loket-grid" id="loketGridContainer"></div>
  <div class="status-footer" id="statusServer">Menghubungkan ke Firebase...</div>

  <script>
    // Konfigurasi Asli Milik Anda
    const firebaseConfig = {
      apiKey: "AIzaSyC9G09C09OchmPPh8nvjKDaKH_iyx7Navo",
      authDomain: "antrian-v2.firebaseapp.com",
      databaseURL: "https://antrian-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "antrian-v2",
      storageBucket: "antrian-v2.firebasestorage.app",
      messagingSenderId: "772961061085",
      appId: "1:772961061085:web:e0875c5f7b59c44af7b334"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const refAntrean = db.ref('antrean_v2');

    let audioActivated = false;
    let audioQueue = [];
    let isSpeaking = false;
    let lastCallTimestamp = 0;
    let audioCtx = null;
    let currentTotalLoket = 5;

    document.getElementById('btnAddLoket').addEventListener('click', function() {
      const newTotal = currentTotalLoket + 1;
      refAntrean.update({ totalLoket: newTotal });
    });

    document.getElementById('btnSubLoket').addEventListener('click', function() {
      if (currentTotalLoket <= 1) {
        alert("Minimal harus ada 1 loket.");
        return;
      }
      const newTotal = currentTotalLoket - 1;
      refAntrean.update({ totalLoket: newTotal });
    });

    document.getElementById('btnAktifkan').addEventListener('click', function() {
      aktifkanAudio();
    });

    db.ref('.info/connected').on('value', (snap) => {
      document.getElementById('statusServer').innerText = snap.val() ? "● Terhubung ke Firebase (Realtime Active)" : "▲ Terputus, menghubungkan ulang...";
    });

    refAntrean.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      currentTotalLoket = data.totalLoket || 5;
      renderLoketGrid(currentTotalLoket);

      const loketData = data.loketData || {};
      for (let i = 1; i <= currentTotalLoket; i++) {
        const el = document.getElementById(`loketNum${i}`);
        if (el) el.innerText = loketData[i] || "-";
      }

      const skipped = data.skipped || [];
      const skippedContainer = document.getElementById('skippedContainer');
      skippedContainer.innerHTML = skipped.length > 0 ? skipped.map(num => `<span class="tag-item">No. ${num}</span>`).join('') : '<span class="empty-text">Tidak ada nomor terlewat</span>';

      const lastCall = data.lastCall;
      if (lastCall && lastCall.timestamp > lastCallTimestamp) {
        lastCallTimestamp = lastCall.timestamp;
        document.getElementById('numDisplay').innerText = lastCall.nomor;
        document.getElementById('loketDisplay').innerText = `SILAKAN KE LOKET ${lastCall.loket}`;

        const pesan = `Nomor antrean ${lastCall.nomor}, silakan menuju loket ${lastCall.loket}`;
        tambahAntreanAudio(pesan);
      } else if (!lastCall) {
        document.getElementById('numDisplay').innerText = "0";
        document.getElementById('loketDisplay').innerText = "Menunggu Panggilan...";
      }
    });

    function renderLoketGrid(total) {
      const container = document.getElementById('loketGridContainer');
      if (container.children.length === total) return; 
      container.innerHTML = '';
      for (let i = 1; i <= total; i++) {
        container.innerHTML += `<div class="loket-card"><div class="loket-card-name">Loket ${i}</div><div class="loket-card-num" id="loketNum${i}">-</div></div>`;
      }
    }

    function aktifkanAudio() {
      audioActivated = true;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch(e) {
        console.log("AudioContext Error", e);
      }

      const btn = document.getElementById('btnAktifkan');
      btn.innerText = "🔊 AUDIO & BEL AKTIF";
      btn.classList.add('active');

      playDingDong(() => speakEngine("Sistem audio dan bel siap digunakan"));
    }

    function playDingDong(callback) {
      if (!audioActivated || !audioCtx) { if(callback) callback(); return; }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }

      try {
        const now = audioCtx.currentTime;
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.5, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.4);
        gain2.gain.setValueAtTime(0.5, now + 0.4);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.4);
        osc2.stop(now + 1.4);

        setTimeout(() => { if (callback) callback(); }, 1400);
      } catch(e) {
        if (callback) callback();
      }
    }

    function tambahAntreanAudio(teks) {
      audioQueue.push(teks);
      prosesAntreanAudio();
    }

    function prosesAntreanAudio() {
      if (isSpeaking || audioQueue.length === 0) return;
      isSpeaking = true;
      const teks = audioQueue.shift();

      playDingDong(() => {
        speakEngine(teks, () => {
          isSpeaking = false;
          setTimeout(prosesAntreanAudio, 300);
        });
      });
    }

    function speakEngine(teks, onEndCallback = null) {
      if (!audioActivated) { if (onEndCallback) setTimeout(onEndCallback, 1000); return; }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(teks);
        utterance.lang = 'id-ID';
        utterance.rate = 0.85;

        let hasFinished = false;
        const finishHandler = () => {
          if (!hasFinished) {
            hasFinished = true;
            if (onEndCallback) onEndCallback();
          }
        };

        utterance.onend = finishHandler;
        utterance.onerror = finishHandler;

        setTimeout(finishHandler, 7000);

        window.speechSynthesis.speak(utterance);
      } else {
        if (onEndCallback) onEndCallback();
      }
    }
  </script>
</body>
</html>
